<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Inter, 'Noto Sans SC', 'Segoe UI', sans-serif">
  <title>SuperMarkdown C 版界面预览</title>
  <desc>SuperMarkdown C 版块面派：冷色系、chrome 退化、编辑器全宽可编辑、Cmd+K 核心入口</desc>

  <!-- 应用背景（冷近白） -->
  <rect x="0" y="0" width="1200" height="640" fill="#FCFCFD"/>

  <!-- AppBar 40px（chrome 退化：薄） -->
  <rect x="0" y="0" width="1200" height="40" fill="#FCFCFD"/>
  <line x1="0" y1="40" x2="1200" y2="40" stroke="#EEEEF0" stroke-width="1"/>
  <!-- Logo（弱化：小图标无强调色） -->
  <rect x="20" y="13" width="14" height="14" rx="3" fill="none" stroke="#6B7280" stroke-width="1.4"/>
  <line x1="24" y1="18" x2="30" y2="18" stroke="#6B7280" stroke-width="1.2"/>
  <line x1="24" y1="22" x2="28" y2="22" stroke="#6B7280" stroke-width="1.2"/>
  <!-- 面包屑：工作区 / 文档名 -->
  <text x="42" y="25" font-size="13" fill="#6B7280">工作区</text>
  <text x="92" y="25" font-size="13" fill="#D1D5DB">/</text>
  <text x="102" y="25" font-size="13" font-weight="500" fill="#1F2024">欢迎使用 SuperMarkdown</text>
  <!-- 右侧：Cmd+K chip + 导出 + 视图 Segmented + 主题 -->
  <rect x="820" y="10" width="200" height="20" rx="6" fill="#F4F4F5" stroke="#EEEEF0" stroke-width="1"/>
  <circle cx="834" cy="20" r="4" fill="none" stroke="#6B7280" stroke-width="1.2"/>
  <line x1="837" y1="23" x2="840" y2="26" stroke="#6B7280" stroke-width="1.2"/>
  <text x="846" y="24" font-size="11" fill="#6B7280">搜索或输入命令…</text>
  <rect x="990" y="14" width="22" height="12" rx="2" fill="none" stroke="#D1D5DB" stroke-width="1"/>
  <text x="995" y="23" font-size="9" fill="#6B7280">⌘K</text>
  <!-- 导出 -->
  <text x="1040" y="25" font-size="13" fill="#6B7280">导出</text>
  <!-- 视图 Segmented（分屏高亮） -->
  <rect x="1080" y="10" width="72" height="20" rx="5" fill="#F4F4F5"/>
  <rect x="1084" y="13" width="20" height="14" rx="3" fill="#FFFFFF" stroke="#EEEEF0" stroke-width="0.8"/>
  <rect x="1108" y="13" width="20" height="14" rx="3" fill="none"/>
  <rect x="1132" y="13" width="20" height="14" rx="3" fill="none"/>
  <!-- 主题（月亮） -->
  <path d="M1158 16 a7 7 0 1 0 6 10 a5 5 0 0 1 -6 -10 z" fill="none" stroke="#6B7280" stroke-width="1.2"/>

  <!-- Sidebar 232px（与主区同底，仅 1px 边框分层） -->
  <line x1="232" y1="40" x2="232" y2="614" stroke="#EEEEF0" stroke-width="1"/>
  <!-- 搜索框 -->
  <rect x="16" y="56" width="200" height="28" rx="6" fill="#F4F4F5"/>
  <circle cx="30" cy="70" r="4" fill="none" stroke="#9CA3AF" stroke-width="1.2"/>
  <line x1="33" y1="73" x2="36" y2="76" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="44" y="74" font-size="12" fill="#9CA3AF">搜索文档</text>
  <!-- 新建文档（ghost：border + accent 文字） -->
  <rect x="16" y="94" width="200" height="32" rx="6" fill="none" stroke="#EEEEF0" stroke-width="1"/>
  <line x1="86" y1="110" x2="96" y2="110" stroke="#2563EB" stroke-width="1.4"/>
  <line x1="91" y1="105" x2="91" y2="115" stroke="#2563EB" stroke-width="1.4"/>
  <text x="104" y="114" font-size="13" font-weight="500" fill="#2563EB">新建文档</text>
  <!-- 文档列表（纯文本无卡片；选中态 accent-soft 底，无竖线） -->
  <rect x="16" y="138" width="200" height="40" rx="6" fill="#EFF6FF"/>
  <text x="28" y="158" font-size="13" font-weight="500" fill="#1F2024">欢迎使用 SuperMarkdown</text>
  <text x="28" y="172" font-size="11" fill="#9CA3AF">1,240 字 · 刚刚</text>
  <text x="28" y="198" font-size="13" fill="#1F2024">项目开发计划</text>
  <text x="28" y="212" font-size="11" fill="#9CA3AF">856 字 · 5 分钟前</text>
  <text x="28" y="238" font-size="13" fill="#1F2024">会议纪要</text>
  <text x="28" y="252" font-size="11" fill="#9CA3AF">320 字 · 1 小时前</text>
  <text x="28" y="278" font-size="13" fill="#1F2024">读书笔记</text>
  <text x="28" y="292" font-size="11" fill="#9CA3AF">2,018 字 · 昨天</text>
  <!-- Sidebar 底部计数 -->
  <line x1="16" y1="590" x2="216" y2="590" stroke="#F4F4F5" stroke-width="1"/>
  <text x="16" y="606" font-size="11" fill="#9CA3AF">4 篇文档</text>

  <!-- 编辑区（全宽可编辑，无 max-width 框）x=232-716 -->
  <rect x="232" y="40" width="484" height="574" fill="#FFFFFF"/>
  <text x="264" y="84" font-size="16" font-weight="700" fill="#2563EB">#</text>
  <text x="280" y="84" font-size="16" font-weight="700" fill="#1F2024">欢迎使用 SuperMarkdown</text>
  <text x="264" y="112" font-size="14" fill="#1F2024">一款打开即写、图片自包含的编辑器。</text>
  <text x="264" y="132" font-size="13" fill="#6B7280">粘贴图片自动转 base64 内嵌，单文件离线可分享。</text>
  <!-- 列表 -->
  <circle cx="272" cy="158" r="2.5" fill="#1F2024"/>
  <text x="282" y="162" font-size="14" fill="#1F2024">分屏实时预览，所见即所得</text>
  <circle cx="272" cy="182" r="2.5" fill="#1F2024"/>
  <text x="282" y="186" font-size="14" fill="#1F2024">800ms 自动保存，告别丢稿焦虑</text>
  <circle cx="272" cy="206" r="2.5" fill="#1F2024"/>
  <text x="282" y="210" font-size="14" fill="#1F2024">明暗双主题，桌面移动双端适配</text>
  <!-- 任务列表（勾选） -->
  <rect x="268" y="228" width="12" height="12" rx="2" fill="#2563EB"/>
  <path d="M270 233 L273 236 L278 231" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="288" y="239" font-size="14" fill="#1F2024">编辑、预览、导出全部离线可用</text>
  <!-- 引用 -->
  <rect x="264" y="258" width="3" height="36" fill="#D6D3D1"/>
  <text x="278" y="274" font-size="13" fill="#6B7280">数据始终留在你的设备上，</text>
  <text x="278" y="290" font-size="13" fill="#6B7280">不上传任何服务器。</text>
  <!-- 代码块 -->
  <rect x="264" y="308" width="420" height="96" rx="8" fill="#F4F4F5" stroke="#EEEEF0" stroke-width="1"/>
  <circle cx="280" cy="324" r="4" fill="#F7C1C1"/>
  <circle cx="296" cy="324" r="4" fill="#FAC775"/>
  <circle cx="312" cy="324" r="4" fill="#C0DD97"/>
  <text x="280" y="350" font-family="'JetBrains Mono', monospace" font-size="12" fill="#1F2024">npm install</text>
  <text x="280" y="370" font-family="'JetBrains Mono', monospace" font-size="12" fill="#1F2024">npm run dev</text>
  <text x="280" y="390" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6B7280"># 打开 http://localhost:5173</text>
  <!-- 块手柄（hover 显示，示意） -->
  <g opacity="0.5">
    <circle cx="252" cy="78" r="1.5" fill="#9CA3AF"/>
    <circle cx="252" cy="84" r="1.5" fill="#9CA3AF"/>
    <circle cx="256" cy="78" r="1.5" fill="#9CA3AF"/>
    <circle cx="256" cy="84" r="1.5" fill="#9CA3AF"/>
  </g>

  <!-- Resizer（中间分隔，默认透明 hover 显示） -->
  <line x1="716" y1="40" x2="716" y2="614" stroke="#EEEEF0" stroke-width="1"/>

  <!-- 预览区 x=720-1200（markdown-body 居中阅读带） -->
  <rect x="720" y="40" width="480" height="574" fill="#FFFFFF"/>
  <text x="760" y="98" font-size="24" font-weight="700" fill="#1F2024">欢迎使用 SuperMarkdown</text>
  <line x1="760" y1="112" x2="1120" y2="112" stroke="#EEEEF0" stroke-width="1"/>
  <text x="760" y="142" font-size="14" fill="#1F2024">一款打开即写、图片自包含的编辑器。</text>
  <text x="760" y="166" font-size="13" fill="#6B7280">粘贴图片自动转 base64 内嵌，单文件离线可分享。</text>
  <circle cx="768" cy="194" r="2.5" fill="#2563EB"/>
  <text x="778" y="198" font-size="14" fill="#1F2024">分屏实时预览，所见即所得</text>
  <circle cx="768" cy="218" r="2.5" fill="#2563EB"/>
  <text x="778" y="222" font-size="14" fill="#1F2024">800ms 自动保存，告别丢稿焦虑</text>
  <circle cx="768" cy="242" r="2.5" fill="#2563EB"/>
  <text x="778" y="246" font-size="14" fill="#1F2024">明暗双主题，桌面移动双端适配</text>
  <rect x="756" y="268" width="3" height="36" fill="#D6D3D1"/>
  <text x="770" y="284" font-size="13" fill="#6B7280">数据始终留在你的设备上，</text>
  <text x="770" y="300" font-size="13" fill="#6B7280">不上传任何服务器。</text>
  <rect x="760" y="318" width="320" height="76" rx="8" fill="#F4F4F5" stroke="#EEEEF0" stroke-width="1"/>
  <text x="780" y="346" font-family="'JetBrains Mono', monospace" font-size="12" fill="#1F2024">npm install</text>
  <text x="780" y="366" font-family="'JetBrains Mono', monospace" font-size="12" fill="#1F2024">npm run dev</text>
  <text x="780" y="386" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6B7280"># 打开 http://localhost:5173</text>

  <!-- StatusBar 26px（chrome 退化：薄） -->
  <rect x="0" y="614" width="1200" height="26" fill="#FCFCFD"/>
  <line x1="0" y1="614" x2="1200" y2="614" stroke="#EEEEF0" stroke-width="1"/>
  <text x="16" y="631" font-size="11" fill="#9CA3AF">1,240 字 · 约 3 分钟</text>
  <circle cx="1140" cy="627" r="3.5" fill="#16A34A"/>
  <text x="1150" y="631" font-size="11" fill="#16A34A">已保存</text>
</svg>
