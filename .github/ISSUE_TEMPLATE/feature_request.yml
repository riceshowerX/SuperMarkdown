name: 功能建议
description: 提出一个新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提议前请先阅读 README 的「路线图」与「为什么选择 SuperMarkdown」——本项目坚持
        **本地优先、零配置、图片自包含**三个核心原则，与之冲突的方案（如强制云端存储）
        大概率不会被采纳。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述你当前遇到的场景，而不是直接给方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: alternative
    attributes:
      label: 已考虑的替代方案
    validations:
      required: false

  - type: checkboxes
    id: principles
    attributes:
      label: 原则确认
      options:
        - label: 该功能不要求用户上传数据到第三方服务器
    validations:
      required: true
